global:
  scrape_interval: 15s       # как часто Prometheus сам ходит и забирает метрики
  evaluation_interval: 15s

scrape_configs:

  # Метрики о себе самом
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Метрики хоста: CPU, память, диск, сеть
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Метрики ВСЕХ Docker-контейнеров на хосте — не только тех, что
  # в этом compose-файле, а вообще всех, что видит Docker daemon
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]